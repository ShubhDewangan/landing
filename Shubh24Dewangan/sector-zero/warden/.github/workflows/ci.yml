name: CI & Security Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-verify:
    name: Run Unit Tests & Engine Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Tests
        run: pnpm test

      - name: Run Engine Scanner Verification
        run: pnpm --filter @sectorzero/engine-scanner test